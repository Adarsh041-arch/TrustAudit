[project]
name = "audit-v2"
version = "0.1.0"
description = "Multi-Model Document Audit Agent — V2"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "boto3>=1.34",
    "psycopg[binary]>=3.2",
    "temporalio>=1.6",
    "google-genai>=1.0",
    "pillow>=12.1",
    "pymupdf>=1.28",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "requests>=2.31",
    "rapidocr-onnxruntime>=1.3",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "import-linter>=2.0",
    "types-PyYAML>=6.0",
    "fpdf2>=2.8",
    "pytest-asyncio>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["audit_v2*", "evaluation*"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = [
    "venv/",
    "app/",
    "backend/",
    "audit-frontend/",
]

[[tool.mypy.overrides]]
module = ["audit_v2.gateway.*"]
strict = false
disallow_untyped_defs = false

# PyMuPDF ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["fitz", "fitz.*", "pymupdf", "pymupdf.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "audit_v2"]
python_files = ["test_*.py", "*_test.py"]
filterwarnings = ["error"]
markers = [
    "chaos: tests that simulate worker crashes, concurrency edge-cases, or Temporal server failures. Excluded from CI (slow, require external infra).",
]

[tool.coverage.run]
source = ["audit_v2"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
